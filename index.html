<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Koers">
<meta name="theme-color" content="#0f1720">
<title>Koers</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* Layout: full-bleed map, one floating bar on top (search or next turn), one sheet at the bottom, tools on the right edge. */
:root{
  --bg:#f4f6f8; --panel:#ffffff; --ink:#0f1720; --muted:#5b6876; --line:#dfe4ea;
  --red:#df1b12; --route:#1a73e8; --route-alt:#8fa3b8; --ok:#1c8a4b; --warn:#c96a00;
  --shadow:0 6px 24px rgba(15,23,32,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1118; --panel:#16202b; --ink:#eef2f6; --muted:#9aa8b6; --line:#2a3644;
  --route:#4c9bff; --route-alt:#5d6f82; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.35 var(--font);overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#map{position:fixed;inset:0}

/* top bar */
#top{position:fixed;z-index:5;top:calc(var(--st) + 10px);left:calc(var(--sl) + 12px);right:calc(var(--sr) + 12px);display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto}
#searchForm{display:flex;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
#q{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:inherit;font-size:17px;padding:14px 16px}
#clearQ{padding:0 16px;color:var(--muted);font-size:20px}
#turn{background:#0f1720;color:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:14px;align-items:center}
#turnIcon{flex:none;width:56px;height:56px;position:relative}
#turnIcon svg{width:56px;height:56px;transition:transform .3s}
#turnIcon b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px}
#turnDist{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
#turnText{font-size:16px;color:#c9d3dd;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#turnWrap{min-width:0}

/* right tools */
#tools{position:fixed;z-index:4;right:calc(var(--sr) + 12px);top:calc(var(--st) + 120px);display:flex;flex-direction:column;gap:10px}
.tool{width:46px;height:46px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px;font-weight:700;color:var(--ink)}
.tool svg{width:22px;height:22px}
.tool.on{background:var(--route);color:#fff}
.tool.off{color:var(--muted);opacity:.55}

/* speed cluster */
#speedBox{position:fixed;z-index:4;left:calc(var(--sl) + 12px);bottom:calc(var(--sb) + 118px);display:flex;align-items:center;gap:8px}
#limit{width:54px;height:54px;border-radius:50%;background:#fff;border:6px solid var(--red);color:#111;display:grid;place-items:center;font-weight:800;font-size:19px;box-shadow:var(--shadow)}
#speed{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:6px 12px;text-align:center;min-width:64px}
#speed b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
#speed span{font-size:11px;color:var(--muted);letter-spacing:.04em}
#speed.over{background:var(--red);color:#fff}
#speed.over span{color:#ffd9d6}

/* bottom sheet */
#sheet{position:fixed;z-index:5;left:0;right:0;bottom:0;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:12px calc(var(--sr) + 14px) calc(var(--sb) + 14px) calc(var(--sl) + 14px);max-height:52%;overflow:auto;-webkit-overflow-scrolling:touch}
#sheet h2{margin:2px 0 10px;font-size:15px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
#sheet h2 button{color:var(--route);font-weight:600}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 2px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{flex:none;font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.row .r b{display:block;color:var(--ink);font-size:14px}
.routes{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.rc{flex:1 0 118px;border:2px solid var(--line);border-radius:12px;padding:9px 11px;text-align:left}
.rc.sel{border-color:var(--route)}
.rc b{font-size:20px;display:block;font-variant-numeric:tabular-nums}
.rc span{font-size:13px;color:var(--muted);display:block}
.rc .delay{color:var(--warn)}
.rc .free{color:var(--ok)}
.actions{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:14px;border-radius:12px;font-weight:700;font-size:16px;text-align:center}
.btn.go{background:var(--route);color:#fff}
.btn.ghost{background:var(--bg);color:var(--ink);flex:0 0 auto;padding-inline:16px}
.btn.stop{background:var(--red);color:#fff;flex:0 0 auto;padding-inline:20px}
.stats{display:flex;align-items:center;gap:14px}
.stats div{flex:1}
.stats b{display:block;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stats span{font-size:12px;color:var(--muted)}
.destline{font-size:13px;color:var(--muted);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#toast{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 190px);background:#0f1720;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);max-width:86%;text-align:center}

/* key setup */
#setup{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:24px}
#setup form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
#setup h1{margin:0;font-size:34px;letter-spacing:-.03em}
#setup h1 i{font-style:normal;color:var(--red)}
#setup p{margin:0;color:var(--muted);font-size:15px}
#keyIn{font:inherit;font-size:16px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
#keyErr{color:var(--red);font-size:14px;min-height:1.2em}

/* markers */
.puck{width:38px;height:38px}
.puck svg{width:38px;height:38px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--red);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.poi{min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:#0f1720;color:#fff;border:2px solid #fff;font:700 12px var(--font);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--sb) + 96px)}

/* landscape: left column holds the next turn (top) and the trip panel (bottom); everything else is map */
@media (orientation:landscape) and (max-height:520px){
  #top{left:calc(var(--sl) + 12px);right:auto;width:300px;margin:0;top:calc(var(--st) + 10px)}
  #turn{padding:9px 12px;gap:10px}
  #turnIcon,#turnIcon svg{width:46px;height:46px}
  #turnDist{font-size:25px}
  #turnText{font-size:14px;-webkit-line-clamp:1}
  #tools{top:calc(var(--st) + 8px);gap:7px}
  .tool{width:42px;height:42px}
  #sheet{left:calc(var(--sl) + 12px);right:auto;width:300px;bottom:calc(var(--sb) + 10px);border-radius:16px;padding:10px 12px;max-height:calc(100% - 80px - var(--st) - var(--sb))}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
  .stats b{font-size:21px}
  .stats .btn.stop{padding:9px 12px;align-self:center}
  .destline{margin-top:6px}
  #speedBox{left:calc(var(--sl) + 324px);bottom:calc(var(--sb) + 10px)}
  #limit{width:46px;height:46px;font-size:16px;border-width:5px}
  #speed b{font-size:20px}
  #stack{left:calc(var(--sl) + 324px);top:calc(var(--st) + 10px)}
  #toast{bottom:calc(var(--sb) + 14px)}
  .maplibregl-ctrl-bottom-right{bottom:calc(var(--sb) + 4px)}
}
.stats span.late{color:var(--warn);font-weight:600}
.pin.drop{background:var(--route)}
.poi.live{background:#fff;border-color:#0f1720;font-size:15px}
.poi.live.haz{border-color:#e8590c}
#map{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

#lanes{display:flex;gap:4px;align-self:flex-start;background:#0f1720;border-radius:12px;padding:6px 8px;box-shadow:var(--shadow)}
#lanes i{width:26px;height:30px;display:grid;place-items:center;border-radius:6px;opacity:.35}
#lanes i.go{opacity:1;background:#2f8cff}
#lanes svg{width:20px;height:20px}
#road{background:var(--panel);border-radius:999px;box-shadow:var(--shadow);padding:6px 12px;font-size:13px;font-weight:600;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px}
.chip{flex:none;border:1.5px solid var(--route);color:var(--route);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}
@media (orientation:landscape) and (max-height:520px){
  #lanes{padding:4px 6px}
  #lanes i{width:22px;height:26px}
  #road{max-width:30vw}
  #tools{gap:6px}
  .tool{width:40px;height:40px}
}

#rbar{position:fixed;z-index:4;right:calc(var(--sr) + 8px);top:calc(var(--st) + 112px);bottom:calc(var(--sb) + 128px);width:50px;display:flex;flex-direction:column;align-items:center;background:rgba(15,23,32,.86);border-radius:25px;box-shadow:var(--shadow);color:#fff;padding:6px 0}
#rcap{font-size:10px;font-weight:700;color:#c9d3dd;height:14px;line-height:14px}
#rmid{position:relative;flex:1;width:100%;margin:16px 0 20px}
#rmid .trk{position:absolute;left:50%;margin-left:-4px;width:8px;top:-10px;bottom:-10px;border-radius:4px;background:#2f8cff}
#rlane{position:absolute;inset:0}
#rlane i{position:absolute;left:50%;margin-left:-4px;width:8px;min-height:4px;border-radius:4px}
#rlane b{position:absolute;left:50%;width:28px;height:28px;margin-left:-14px;transform:translateY(50%);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px;font-weight:400;line-height:1}
#rlane b.jam{width:36px;margin-left:-18px;height:20px;border-radius:10px;color:#fff;font-size:11px;font-weight:800;border:1.5px solid #fff}
#rmid .you{position:absolute;left:50%;bottom:-18px;margin-left:-11px;width:22px;height:22px;border-radius:50%;background:#fff;color:#1a73e8;display:grid;place-items:center;font-size:11px}
#rnext{font-size:11px;font-weight:700;line-height:1.2;text-align:center;min-height:28px}
body.nav #tools{right:calc(var(--sr) + 66px)}
body.nav .maplibregl-ctrl-bottom-right{right:58px}
@media (orientation:landscape) and (max-height:520px){
  #rbar{top:calc(var(--st) + 8px);bottom:calc(var(--sb) + 8px)}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <form id="searchForm" autocomplete="off">
    <input id="q" type="search" placeholder="Where to?" enterkeyhint="search" aria-label="Destination">
    <button type="button" id="clearQ" aria-label="Clear" hidden>×</button>
  </form>
  <div id="turn" hidden>
    <div id="turnIcon">
      <svg viewBox="0 0 56 56" id="arrow"><path d="M28 6 L44 26 H33 V50 H23 V26 H12 Z" fill="#fff"/></svg>
      <b id="turnExit"></b>
    </div>
    <div id="turnWrap"><div id="turnDist">–</div><div id="turnText"></div></div>
  </div>
  <div id="lanes" hidden></div>
</div>

<div id="tools">
  <button class="tool" id="bLocate" aria-label="Recentre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>

</div>

<div id="rbar" hidden><div id="rcap"></div><div id="rmid"><div class="trk"></div><div id="rlane"></div><div class="you">▲</div></div><div id="rnext"></div></div>

<div id="speedBox" hidden>

</div>

<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<div id="setup" hidden>

    <div id="keyErr"></div>

  </form>
</div>

const L = s => (TR[LANG.slice(0, 2)] || {})[s] ?? s;

const S = { mode: 'browse', pos: null, heading: 0, speed: null, acc: null, dest: null, stops: [], routes: [], sel: 0,
  route: null, idx: 0, along: 0, following: true, muted: store.get('muted') === '1', traffic: true, vector: false,

/* ---------- helpers ---------- */
const OV = ['pois', 'pin', 'inc'];
const base = () => OV.includes(S.mode) ? S.prevMode : S.mode;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function hav(a, b){
  const dLat = (b[1] - a[1]) * RAD, dLon = (b[0] - a[0]) * RAD;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * RAD) * Math.cos(b[1] * RAD) * Math.sin(dLon / 2) ** 2;
  return 12742000 * Math.asin(Math.sqrt(h));
}
function bearing(a, b){
  const y = Math.sin((b[0] - a[0]) * RAD) * Math.cos(b[1] * RAD);
  const x = Math.cos(a[1] * RAD) * Math.sin(b[1] * RAD) - Math.sin(a[1] * RAD) * Math.cos(b[1] * RAD) * Math.cos((b[0] - a[0]) * RAD);
  return (Math.atan2(y, x) / RAD + 360) % 360;
}
const fmtDist = m => m < 1000 ? Math.max(10, Math.round(m / 10) * 10) + ' m' : (m / 1000).toFixed(m < 10000 ? 1 : 0) + ' km';
function fmtDur(s){ const m = Math.max(1, Math.round(s / 60)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0'); }
const clock = d => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

async function tt(path, params = {}, opts){
  const u = new URL(API + path);
  u.searchParams.set('key', KEY);
  for (const [k, v] of Object.entries(params)){
    if (Array.isArray(v)) v.forEach(x => u.searchParams.append(k, x));
    else if (v != null) u.searchParams.set(k, v);
  }
  const r = await fetch(u, opts);
  if (!r.ok){ const e = new Error('TomTom request failed (' + r.status + ')'); e.status = r.status; throw e; }
  return r.json();
}

/* ---------- extras: incidents, snap to roads, autocomplete, lanes, map styles ---------- */
const HAS_ORBIS = typeof ORB !== 'undefined';
const FEAT = { snap: true, inc: true, incOrbis: true, auto: true, autoOrbis: true, lanes: true, cam: true, haz: true, extOrbis: true }, FEAT_ERR = {};
function featFail(k, e){ FEAT[k] = false; FEAT_ERR[k] = String(e?.message || e || 'failed').slice(0, 160); }
const srch = (path, params, opts) => HAS_ORBIS ? places(path, params, opts) : tt('/search/2' + path, params, opts);
const noAccess = e => [400, 403, 404].includes(e?.status);

/* map styles */
const KINDS = ['std', 'relief', 'sat'], KIND_NAME = { std: 'Map', relief: 'Relief', sat: 'Satellite' };
async function loadStyle(kind){
  const dark = matchMedia('(prefers-color-scheme: dark)').matches, urls = styleUrls(kind, dark ? 'dark' : 'light');
  for (let i = 0; i < urls.length; i++){
    try { const r = await fetch(urls[i]); if (!r.ok) throw new Error('style ' + r.status); return await r.json(); }
    catch (e){ if (HAS_ORBIS && kind === 'std' && i === 0 && urls.length > 1) orbFail('map', e); }
  }
  return null;
}
function addRouteLayers(){
  if (map.getSource('route')) return;
  map.addSource('route', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  const lay = { 'line-cap': 'round', 'line-join': 'round' };
  map.addLayer({ id: 'r-alt', type: 'line', source: 'route', filter: ['==', ['get', 'k'], 'alt'], layout: lay, paint: { 'line-color': '#8fa3b8', 'line-width': 6, 'line-opacity': .8 } });
  map.addLayer({ id: 'r-case', type: 'line', source: 'route', filter: ['==', ['get', 'k'], 'main'], layout: lay, paint: { 'line-color': '#0b3d91', 'line-width': 11 } });
  map.addLayer({ id: 'r-main', type: 'line', source: 'route', filter: ['==', ['get', 'k'], 'main'], layout: lay, paint: { 'line-color': '#2f8cff', 'line-width': 7 } });
}
async function cycleStyle(){
  if (S.styleBusy || !map) return; S.styleBusy = true;
  try {
    let i = KINDS.indexOf(S.kind || 'std'), st = null, next = null;
    for (let n = 0; n < KINDS.length - 1 && !st; n++){ i = (i + 1) % KINDS.length; next = KINDS[i]; st = await loadStyle(next); }
    if (!st){ toast('This map style is not available with your key.', 5000); return; }
    S.kind = next;
    map.once('style.load', () => { addRouteLayers(); drawRoutes(); setTraffic(S.traffic); });
    map.setStyle(st, { diff: false });
    $('bStyle').classList.toggle('on', next !== 'std'); toast(KIND_NAME[next], 1500);
  } finally { S.styleBusy = false; }
}

/* speed, limit and road name: from the route while navigating, from Snap to Roads otherwise */
function paintSpeed(){
  const nav = base() === 'nav', show = nav || (S.mode === 'browse' && !!S.free);
  $('speedBox').hidden = !show; if (!show) return;
  let lim = null;
  if (nav && S.route){ const l = S.route.limits.find(x => S.idx >= x.startPointIndex && S.idx < x.endPointIndex); lim = l ? l.maxSpeedLimitInKmh : null; }
  else if (S.free) lim = S.free.limit;
  $('limit').hidden = !lim; if (lim) $('limit').textContent = lim;
  $('speed').classList.toggle('over', !!lim && S.speed != null && S.speed * 3.6 > lim + 3);
  const name = !nav && S.free ? S.free.name : '';
  $('road').hidden = !name; $('road').textContent = name;
}
const SNAP_FIELDS = '{projectedPoints{type,geometry{type,coordinates},properties{routeIndex,snapResult}},route{type,geometry{type,coordinates},properties{id,speedLimits{value,unit,type},address{roadName,roadNumbers}}}}';
const snapBuf = []; let snapBusy = false, snapAt = 0, snapOff = null, snapLast = null;
function feedSnap(f){
  const p = [f.lon, f.lat], now = Date.now(), last = snapBuf[snapBuf.length - 1];
  if (last && (hav(last.p, p) > 1500 || now - last.t > 90000)){ snapBuf.length = 0; snapOff = null; S.free = null; }
  const tail = snapBuf[snapBuf.length - 1];
  if (!tail || hav(tail.p, p) >= 12){ snapBuf.push({ p, t: now }); if (snapBuf.length > 6) snapBuf.shift(); }
  const end = snapBuf[snapBuf.length - 1];
  if (FEAT.snap && !snapBusy && snapBuf.length >= 2 && end !== snapLast && now - snapAt > 4000 && (f.acc || 0) < 60) doSnap();
}
async function doSnap(){
  snapBusy = true; snapAt = Date.now();
  const pts = snapBuf.slice(), end = pts[pts.length - 1]; snapLast = end;
  try {
    const j = await tt('/snapToRoads/1', { points: pts.map(x => x.p[0].toFixed(6) + ',' + x.p[1].toFixed(6)).join(';'), fields: SNAP_FIELDS, vehicleType: 'PassengerCar', measurementSystem: 'metric' });
    const pp = (j.projectedPoints || [])[pts.length - 1], c = pp && pp.geometry && pp.geometry.coordinates;
    if (!c || pp.properties?.snapResult !== 'Matched'){ snapOff = null; S.free = null; return; }
    snapOff = hav(c, end.p) <= 35 ? [c[0] - end.p[0], c[1] - end.p[1]] : null;
    const pr = (j.route || [])[pp.properties.routeIndex]?.properties || {};
    let sl = pr.speedLimits; if (Array.isArray(sl)) sl = sl.find(x => x.type === 'Maximum') || sl[0];
    let v = sl && sl.type !== 'Recommended' ? sl.value : null; if (v != null && /^mph$/i.test(sl.unit || '')) v = Math.round(v * 1.609);
    S.free = { limit: v || null, name: pr.address?.roadName || (pr.address?.roadNumbers || [])[0] || '' };
    paintSpeed();
  } catch (e){ if (noAccess(e)) featFail('snap', e); }
  finally { snapBusy = false; }
}

/* traffic incident details */
const ICON = ['unknown', 'accident', 'fog', 'dangerousConditions', 'rain', 'ice', 'jam', 'laneClosed', 'roadClosed', 'roadWorks', 'wind', 'flooding', 'unknown', 'unknown', 'brokenDownVehicle'];
const INC_ATTR = 'incidents(type,geometry(type,coordinates),properties(id,iconCategory,magnitudeOfDelay,events(description,code,iconCategory),startTime,endTime,from,to,lengthInMeters,delayInSeconds,roadNumbers,timeValidity))';
const INC_FIELDS = '{incidents{type,geometry{type,coordinates},properties{id,iconCategory,magnitudeOfDelay,events{description,code,iconCategory},startTime,endTime,from,to,length,delay,roadNumbers,timeValidity}}}';
function normInc(f, orbis){
  const p = f.properties || {};
  return { id: p.id, geom: f.geometry, cat: orbis ? (p.iconCategory || 'unknown') : (ICON[p.iconCategory] || 'unknown'),
    desc: [...new Set((p.events || []).map(e => e.description).filter(Boolean))].join(', '), from: p.from || '', to: p.to || '',
    len: orbis ? p.lengthInMeters : p.length, delay: orbis ? p.delayInSeconds : p.delay, end: p.endTime, roads: p.roadNumbers || [] };
}
async function fetchIncidents(b){
  const bbox = b.map(x => x.toFixed(5)).join(',');
  if (HAS_ORBIS && FEAT.incOrbis){
    try {
      const r = await fetch(`${API}/maps/orbis/traffic/incidents/details?apiVersion=2&bbox=${bbox}&timeValidity=present&key=${KEY}`, { headers: { 'Attributes': INC_ATTR, 'Accept-Language': LANG } });
      if (!r.ok) throw new Error('incidents ' + r.status);
      return ((await r.json()).incidents || []).filter(Boolean).map(f => normInc(f, true));
    } catch (e){ featFail('incOrbis', e); }
  }
  const j = await tt('/traffic/services/5/incidentDetails', { bbox, fields: INC_FIELDS, language: LANG, timeValidityFilter: 'present' });
  return (j.incidents || []).filter(Boolean).map(f => normInc(f, false));
}
function distToGeom(p, g){
  if (!g || !g.coordinates) return 1e9;
  if (g.type === 'Point') return hav(p, g.coordinates);
  const cs = g.coordinates; if (cs.length < 2) return cs.length ? hav(p, cs[0]) : 1e9;
  return snap({ pts: cs, cum: cs.map(() => 0) }, p, 0, true).d;
}
let incSeq = 0;
async function tapIncident(e){
  if (!FEAT.inc || Date.now() - (S.lpAt || 0) < 900 || map.getZoom() < 9) return;
  const m0 = S.mode; if (!['browse', 'nav', 'preview', 'inc'].includes(m0)) return;
  const r = 26, a = map.unproject([e.point.x - r, e.point.y + r]), b = map.unproject([e.point.x + r, e.point.y - r]), seq = ++incSeq;
  try {
    const list = await fetchIncidents([Math.min(a.lng, b.lng), Math.min(a.lat, b.lat), Math.max(a.lng, b.lng), Math.max(a.lat, b.lat)]);
    if (seq !== incSeq || S.mode !== m0 || !list.length) return;
    const p = [e.lngLat.lng, e.lngLat.lat]; let best = null, bd = 1e9;
    for (const i of list){ const d = distToGeom(p, i.geom); if (d < bd){ bd = d; best = i; } }
    if (!best) return;
    if (!OV.includes(S.mode)) S.prevMode = S.mode;
    S.inc = best; S.mode = 'inc'; render();
  } catch (err){ if (noAccess(err)) featFail('inc', err); }
}
function incOnRoute(rt, i){
  const g = i.geom; if (!g || !g.coordinates) return null;
  const cs = g.type === 'Point' ? [g.coordinates] : g.coordinates, n = cs.length; if (!n) return null;
  const ks = n > 2 ? [0, n >> 1, n - 1] : cs.map((_, k) => k); let best = null;
  for (const k of ks){
    const s = snap(rt, cs[k], 0, true); if (s.d > 25 || s.along <= S.along) continue;
    if (n > 1){
      const ib = bearing(cs[Math.max(0, k - 1)], cs[Math.min(n - 1, k + 1)]), rb = bearing(rt.pts[s.idx], rt.pts[s.idx + 1] || rt.pts[s.idx]);
      if (Math.abs(((ib - rb + 540) % 360) - 180) > 60) continue;
    }
    if (best == null || s.along < best) best = s.along;
  }
  return best;
}
async function checkAhead(){
  const rt = S.route; if (!rt || !FEAT.inc || S.incBusy) return;
  const nx = rt.ins.find(i => i.off > S.along + 5);
  if (nx && nx.off - S.along < 500){ S.incAt = Date.now() - 45000; return; }
  S.incAt = Date.now(); S.incBusy = true;

  return { pt: [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t], idx: i, brg: bearing(A, B) };
}

/* ---------- navigation ---------- */
async function startNav(simulate){
  snapOff = null; S.incAt = Date.now() - 50000; S.incSaid = {};
  S.route = S.routes[S.sel]; attachLanes(S.route); liveDirty = true; S.idx = 0; S.along = 0; S.said = {}; S.offCount = 0; S.snapPt = null;
  S.mode = 'nav'; S.following = true; $('bLocate').classList.remove('on'); S.lastRefresh = Date.now();
  render(); drawRoutes();
  const dep = S.route.ins[0]; say(dep?.message || '');
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch {}
  if (simulate) startSim(); else if (S.pos) onFix({ lat: S.pos.lat, lon: S.pos.lon, speed: S.speed, heading: null, acc: S.acc });
}
function stopNav(msg){
  stopSim(); S.mode = 'browse'; S.route = null; S.routes = []; S.dest = null; S.stops = []; S.snapPt = null;
  setDestMarker(); clearPois(); removePin(); drawRoutes(); $('q').value = ''; $('clearQ').hidden = true;
  try { wake && wake.release(); } catch {} wake = null;
  map.easeTo({ pitch: 0, bearing: 0, zoom: 14, padding: { top: 0, bottom: 0, left: 0, right: 0 }, duration: 600 });
  render(); if (msg) toast(msg, 5000);
}
function navTick(){
  const rt = S.route, p = [S.pos.lon, S.pos.lat];
  let s = snap(rt, p, S.idx, false); if (s.d > 80) s = snap(rt, p, 0, true);
  const tol = Math.max(50, (S.acc || 0) * 1.5);
  if (s.d > tol){
    if (++S.offCount >= 4 && !S.sim && (S.acc || 0) < 80) reroute(true);
    updateNavUi(); return null;
  }
  S.offCount = 0; S.idx = s.idx; S.along = s.along; S.snapPt = s.pt;
  if ((S.speed || 0) <= 1.5 || S.sim) S.heading = bearing(rt.pts[s.idx], rt.pts[s.idx + 1] || rt.pts[s.idx]);
  while (rt.wp.length && S.along > rt.wp[0] + 20){ rt.wp.shift(); S.stops.shift(); }
  if (rt.len - S.along < 30){ const last = rt.ins[rt.ins.length - 1]; say(last?.message || ''); stopNav(last?.message || L('You have arrived.')); return s.pt; }
  drawRoutes(); updateNavUi();
  if (Date.now() - S.lastRefresh > 240000) reroute(false);
  if (Date.now() - (S.incAt || 0) > 60000) checkAhead();
  if (!rt.barBusy && (rt.barTo == null || (rt.barTo < rt.len && S.along > rt.barTo - 40000))) loadBarPois(rt);
  return s.pt;
}
function delayLeft(rt){
  if (rt.delays && rt.delays.length) return rt.delays.reduce((a, x) => a + (x.end > S.idx ? x.d : 0), 0);
  return (rt.sum.trafficDelayInSeconds || 0) * Math.max(0, 1 - S.along / (rt.len || 1));
}
const isLand = () => innerWidth > innerHeight && innerHeight < 520;
function updateNavUi(){
  const rt = S.route; if (!rt) return;
  const n = rt.ins.findIndex(i => i.off > S.along + 5), ins = n >= 0 ? rt.ins[n] : null, v = S.speed || 0;
  if (ins){
    const d = ins.off - S.along;
    $('turnDist').textContent = fmtDist(d);
    $('turnText').textContent = ins.street || (ins.roadNumbers || []).join(' / ') || ins.message || '';
    setArrow(ins); announce(ins, n, d, v);
  }
  paintSpeed(); paintLanes(rt); updateBar(rt); liveAlerts(rt);
  const left = rt.sum.travelTimeInSeconds - timeAt(rt, S.along);
  const e = $('nEta'); if (e){ e.textContent = clock(new Date(Date.now() + left * 1000)); $('nTime').textContent = fmtDur(left); $('nDist').textContent = fmtDist(rt.len - S.along);
    const dl = delayLeft(rt), sub = $('nTimeSub'); sub.classList.toggle('late', dl >= 60); sub.textContent = dl >= 60 ? '+' + fmtDur(dl) + ' ' + L('delay') : L('to go'); }
}
function setArrow(ins){
  const m = ins.maneuver || '', ang = { STRAIGHT: 0, KEEP_RIGHT: 25, BEAR_RIGHT: 45, TURN_RIGHT: 90, SHARP_RIGHT: 135, KEEP_LEFT: -25, BEAR_LEFT: -45, TURN_LEFT: -90, SHARP_LEFT: -135,
    MAKE_UTURN: 180, ENTER_MOTORWAY: 0, ENTER_FREEWAY: 0, ENTER_HIGHWAY: 0, TAKE_EXIT: 30, MOTORWAY_EXIT_LEFT: -30, MOTORWAY_EXIT_RIGHT: 30,
    ROUNDABOUT_RIGHT: 90, ROUNDABOUT_LEFT: -90, ROUNDABOUT_CROSS: 0, ROUNDABOUT_BACK: 180, ARRIVE_LEFT: -90, ARRIVE_RIGHT: 90, WAYPOINT_LEFT: -90, WAYPOINT_RIGHT: 90 }[m] ?? 0;
  $('arrow').style.transform = `rotate(${ang}deg)`;
  const round = /ROUNDABOUT/.test(m);
  $('turnExit').textContent = round && ins.roundaboutExitNumber ? ins.roundaboutExitNumber : '';
  $('turnExit').style.color = '#0f1720'; $('turnExit').style.paddingTop = '14px';
}
function announce(ins, n, d, v){
  if (/arriv/i.test(ins.maneuver || '')) return;
  const st = S.said[n] || (S.said[n] = {}), far = v > 22 ? 2000 : 800, mid = v > 22 ? 600 : 250, now = Math.max(35, v * 3.5), msg = ins.message || '';
  if (d <= now){ if (!st.now){ st.now = st.mid = st.far = 1; say(msg); } }
  else if (d <= mid){ if (!st.mid){ st.mid = st.far = 1; say(`${WORDS[0]} ${spokenDist(d)}, ${lowerFirst(msg)}`); } }
  else if (d <= far){ if (!st.far){ st.far = 1; if (d > mid * 1.6) say(`${WORDS[0]} ${spokenDist(d)}, ${lowerFirst(msg)}`); } }
}
async function reroute(forced){
  if (S.rerouting || S.mode !== 'nav') return;
  S.rerouting = true; S.lastRefresh = Date.now();
  if (forced) toast('Off route. Recalculating…');
  try {
    const r = (await calcRoute(0))[0];
    if (S.mode !== 'nav') return;
    const left = S.route.sum.travelTimeInSeconds - timeAt(S.route, S.along);
    const saved = left - r.sum.travelTimeInSeconds;
    if (forced || saved > 120){
      S.route = r; S.routes = [r]; S.sel = 0; S.idx = 0; S.along = 0; S.said = {}; S.offCount = 0; attachLanes(r); matchLive(r);
      if (!forced) toast(`${L('Faster route found. Saves')} ${fmtDur(saved)}.`, 6000);
      drawRoutes(); updateNavUi();
    }
  } catch (e){ if (forced) toast(e.message); }
  finally { S.rerouting = false; S.offCount = 0; }
}
function startSim(){
  S.sim = { along: 0 };
  S.sim.timer = setInterval(() => {
    const rt = S.route; if (!rt || base() !== 'nav'){ stopSim(); return; }
    const here = pointAt(rt, S.sim.along), lim = rt.limits.find(l => here.idx >= l.startPointIndex && here.idx < l.endPointIndex);
    const v = ((lim?.maxSpeedLimitInKmh || 50) * 0.95) / 3.6;
    S.sim.along = Math.min(rt.len, S.sim.along + v);
    const nx = pointAt(rt, S.sim.along);
    onFix({ lat: nx.pt[1], lon: nx.pt[0], speed: v, heading: nx.brg, acc: 5 });
  }, 1000);
}
function stopSim(){ if (S.sim){ clearInterval(S.sim.timer); S.sim = null; } }

/* ---------- fuel and parking ---------- */
async function findPois(kind){
  if (!S.pos){ toast('No GPS position yet. Try again in a moment.'); return; }
  if (S.poiKind === kind){ clearPois(); if (S.mode === 'pois'){ S.mode = S.prevMode || 'browse'; render(); } return; }
  clearPois(); S.poiKind = kind; $(kind === 'fuel' ? 'bFuel' : 'bPark').classList.add('on');
  const cat = kind === 'fuel' ? '7311' : '7369,7313', word = kind === 'fuel' ? 'petrol station' : 'parking';
  const rt = base() === 'nav' ? S.route : (base() === 'preview' ? S.routes[S.sel] : null);
  toast('Searching…', 8000);
  try {
    let j;
    if (rt){
      let pts = rt.pts.slice(base() === 'nav' ? S.idx : 0);
      if (kind === 'park') pts = pts.slice(-Math.max(2, Math.ceil(pts.length * 0.15)));
      const step = Math.max(1, Math.ceil(pts.length / 300)), body = { route: { points: pts.filter((_, i) => i % step === 0 || i === pts.length - 1).map(p => ({ lat: p[1], lon: p[0] })) } };
      j = await tt(`/search/2/searchAlongRoute/${encodeURIComponent(word)}.json`, { maxDetourTime: 600, categorySet: cat, limit: 12, language: LANG },
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    } else {
      j = await tt('/search/2/nearbySearch/.json', { lat: S.pos.lat, lon: S.pos.lon, radius: 8000, categorySet: cat, limit: 12, language: LANG });
    }
    $('toast').hidden = true;
    S.pois = (j.results || []).map(placeOf);
    if (!S.pois.length){ toast('Nothing found nearby.'); clearPois(); return; }
    S.pois.forEach((p, i) => {
      const e = document.createElement('div'); e.className = 'poi'; e.textContent = kind === 'fuel' ? 'F' : 'P';
      e.onclick = () => pickPoi(i);
      poiMarkers.push(new maplibregl.Marker({ element: e }).setLngLat([p.lon, p.lat]).addTo(map));
    });
    if (!OV.includes(S.mode)) S.prevMode = S.mode;
    removePin(); S.inc = null;
    S.mode = 'pois'; render(); enrichPois(kind);
  } catch (e){ toast(e.message); clearPois(); }
}
async function enrichPois(kind){
  await Promise.all(S.pois.slice(0, 8).map(async (p, i) => {
    try {
      if (kind === 'fuel' && p.src?.fuelPrice?.id){
        p.extra = fuelText(await extData('fuelPrice', p.src.fuelPrice.id)).slice(0, 3).join(' · ');
      } else if (kind === 'park' && p.src?.parkingAvailability?.id){
        const j = await extData('parkingAvailability', p.src.parkingAvailability.id);
        const c = j.statuses?.[0]?.current; if (c) p.extra = c.emptySpots != null ? c.emptySpots + ' free' : (c.availability || '');
      }
      const el = document.querySelector(`[data-poi="${i}"] .s`); if (el && p.extra) el.textContent = p.extra + (p.addr ? ' · ' + p.addr : '');
    } catch {}
  }));
}
async function pickPoi(i){
  const p = S.pois[i], back = S.prevMode; clearPois();
  if ((back === 'nav' || back === 'preview') && S.dest){
    S.stops = [p]; toast('Adding stop…', 8000);
    try {
      const rs = await calcRoute(0); $('toast').hidden = true;
      S.routes = rs; S.sel = 0; S.mode = back;
      if (back === 'nav'){ S.route = rs[0]; attachLanes(rs[0]); matchLive(rs[0]); S.idx = 0; S.along = 0; S.said = {}; S.lastRefresh = Date.now(); }
      render(); drawRoutes(); if (back === 'preview') fitRoute(rs[0]);
    } catch (e){ S.stops = []; S.mode = back; render(); toast(e.message); }
  } else planTo(p);
}

/* ---------- UI ---------- */
function render(){
  const sh = $('sheet'), nav = base() === 'nav';
  $('searchForm').hidden = nav; $('turn').hidden = !nav; $('rbar').hidden = !nav; document.body.classList.toggle('nav', nav);
  if (!nav){ $('lanes').hidden = true; lanesShown = null; }
  paintSpeed();
  let h = '';
  if (S.mode === 'results'){
    h = `<h2>${L(S.recentShown ? 'Recent' : 'Results')}<button data-act="close">${L('Close')}</button></h2>` + (S.results.length ? S.results.map((r, i) =>
      `<button class="row" data-res="${i}"><div class="main"><div class="t">${esc(r.name)}</div><div class="s">${esc(r.addr)}</div></div><div class="r">${r.dist != null ? fmtDist(r.dist) : ''}</div></button>`).join('') : `<div class="s">${L('No matches.')}</div>`);
    if (S.sugg && S.sugg.length) h = h.replace('</h2>', '</h2><div class="chips">' + S.sugg.map((x, i) => `<button class="chip" data-sugg="${i}">${esc(x.label)}</button>`).join('') + '</div>');
  } else if (S.mode === 'pois'){
    h = `<h2>${L(S.poiKind === 'fuel' ? 'Fuel' : 'Parking')} ${L(S.prevMode === 'browse' ? 'nearby' : 'on your route')}<button data-act="closePois">${L('Close')}</button></h2>` + S.pois.map((r, i) =>
      `<button class="row" data-poi="${i}"><div class="main"><div class="t">${esc(r.name)}</div><div class="s">${esc(r.addr)}</div></div><div class="r">${r.detour != null ? '<b>+' + fmtDur(r.detour) + '</b>' + L('detour') : (r.dist != null ? fmtDist(r.dist) : '')}</div></button>`).join('');
  } else if (S.mode === 'preview'){
    h = `<h2>${L('To')} ${esc(S.dest.name)}<button data-act="cancel">${L('Cancel')}</button></h2><div class="routes">` + S.routes.map((r, i) => {
      const d = r.sum.trafficDelayInSeconds || 0;
      return `<button class="rc ${i === S.sel ? 'sel' : ''}" data-route="${i}"><b>${fmtDur(r.sum.travelTimeInSeconds)}</b><span>${fmtDist(r.len)} · ${clock(new Date(Date.now() + r.sum.travelTimeInSeconds * 1000))}</span><span class="${d > 60 ? 'delay' : 'free'}">${d > 60 ? '+' + fmtDur(d) + ' ' + L('traffic') : L('No delays')}</span></button>`;
    }).join('') + `</div>${S.stops.length ? `<div class="destline">${cap(L('via'))} ${esc(S.stops[0].name)}</div>` : ''}<div class="actions"><button class="btn ghost" data-act="sim">${L('Simulate')}</button><button class="btn go" data-act="go">${L('Start')}</button></div>`;
  } else if (S.mode === 'inc'){
    const i = S.inc, road = [i.roads.join(' / '), [i.from, i.to].filter(Boolean).join(' → ')].filter(Boolean).join(': ');
    const until = i.end ? new Date(i.end) : null, soon = until && !isNaN(until) && until - Date.now() < 72e6;
    h = `<h2>${esc(i.desc || L('Traffic incident'))}<button data-act="closeInc">${L('Close')}</button></h2>` +
      (road ? `<div class="destline" style="margin:0 0 10px">${esc(road)}</div>` : '') +
      `<div class="stats"><div><b>${(i.delay || 0) >= 60 ? '+' + fmtDur(i.delay) : '–'}</b><span>${L('Delay')}</span></div><div><b>${i.len ? fmtDist(i.len) : '–'}</b><span>${L('Length')}</span></div><div><b>${until && !isNaN(until) ? (soon ? clock(until) : until.toLocaleDateString([], { day: 'numeric', month: 'short' })) : '–'}</b><span>${L('Until')}</span></div></div>`;
  } else if (S.mode === 'pin'){
    h = `<h2>${esc(S.pin.name)}<button data-act="closePin">${L('Close')}</button></h2><div class="actions"><button class="btn go" data-act="navPin">${L('Navigate here')}</button></div>`;
  } else if (S.mode === 'nav'){
    h = `<div class="stats"><div><b id="nTime">–</b><span id="nTimeSub">${L('to go')}</span></div><div><b id="nDist">–</b><span>${L('distance')}</span></div><div><b id="nEta">–</b><span>${L('arrival')}</span></div><button class="btn stop" data-act="end">${L('End')}</button></div><div class="destline">${esc(S.dest.name)}${S.stops.length ? ' ' + L('via') + ' ' + esc(S.stops[0].name) : ''}${S.sim ? ' · ' + L('simulation') : ''}</div>`;
  }
  sh.innerHTML = h; sh.hidden = !h;
  if (S.mode === 'nav') updateNavUi();
}
$('sheet').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.res != null) planTo(S.results[+b.dataset.res]);
  else if (b.dataset.poi != null) pickPoi(+b.dataset.poi);
  else if (b.dataset.route != null) selectRoute(b.dataset.route);
  else if (b.dataset.sugg != null) pickSugg(+b.dataset.sugg);
  else switch (b.dataset.act){
    case 'close': S.mode = 'browse'; render(); break;
    case 'closePois': { const m = S.prevMode || 'browse'; clearPois(); S.mode = m; render(); break; }
    case 'cancel': stopNav(); break;
    case 'go': startNav(false); break;
    case 'sim': startNav(true); break;
    case 'end': stopNav(); break;
    case 'closeInc': S.inc = null; S.mode = S.prevMode || 'browse'; render(); break;
    case 'closePin': removePin(); S.mode = S.prevMode || 'browse'; render(); break;
    case 'navPin': { const p = S.pin; stopSim(); planTo(p); break; }
  }
});
$('q').addEventListener('input', () => {
  const q = $('q').value.trim(); $('clearQ').hidden = !q; clearTimeout(searchTimer);
  S.sugg = [];
  if (!q) showRecent();
  if (q.length >= 3) searchTimer = setTimeout(() => { runSearch(q); runAuto(q); }, 300);
});
$('searchForm').addEventListener('submit', e => { e.preventDefault(); const q = $('q').value.trim(); if (q){ clearTimeout(searchTimer); runSearch(q); $('q').blur(); } });
$('clearQ').onclick = () => { $('q').value = ''; $('clearQ').hidden = true; if (S.mode === 'results'){ S.mode = 'browse'; render(); } $('q').focus(); showRecent(); };
$('q').addEventListener('focus', showRecent);
$('bLocate').onclick = () => {
  S.following = true; $('bLocate').classList.remove('on');
  if (S.pos && S.mode !== 'nav') map.easeTo({ center: [S.pos.lon, S.pos.lat], zoom: 15, pitch: 0, bearing: 0, duration: 600 });
};
$('bTraffic').onclick = () => setTraffic(!S.traffic);
$('bFuel').onclick = () => findPois('fuel');
$('bPark').onclick = () => findPois('park');
$('bStyle').onclick = cycleStyle;
function paintMute(){ $('bMute').classList.toggle('off', S.muted); $('muteWave').style.display = S.muted ? 'none' : ''; }
$('bMute').onclick = () => { S.muted = !S.muted; store.set('muted', S.muted ? '1' : '0'); paintMute(); if (S.muted) try { speechSynthesis.cancel(); } catch {} else say(' '); };
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && S.mode === 'nav' && navigator.wakeLock) try { wake = await navigator.wakeLock.request('screen'); } catch {}
});

/* ---------- boot ---------- */
async function boot(){
  $('setup').hidden = true; paintMute();
  if (!window.maplibregl){ toast('The map library did not load. Check your connection and reload.', 10000); return; }
  await initMap(); render(); startGps();
}
$('keyForm').addEventListener('submit', async e => {
  e.preventDefault(); const k = $('keyIn').value.trim(); if (!k) return;
  $('keyErr').textContent = L('Checking…'); KEY = k;
  try { await tt('/search/2/search/Amsterdam.json', { limit: 1 }); store.set('tt_key', k); $('keyErr').textContent = ''; boot(); }
  catch (err){ KEY = ''; $('keyErr').textContent = L(err.status === 403 ? 'This key was refused. Check that Search, Routing, Map Display and Traffic are enabled on it.' : 'Could not reach TomTom. Check your connection.'); }
});
$('q').placeholder = L('Where to?'); $('keyIn').placeholder = L('TomTom API key');
$('setupText').textContent = L('Car navigation on TomTom maps, search, routing and live traffic. Paste your TomTom API key once. It stays on this phone.');
$('keyGo').textContent = L('Start');
if (KEY) boot(); else $('setup').hidden = false;
</script>
